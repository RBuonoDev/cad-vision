<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css"><script src="solver.js"></script>
<div class="tools"><button id="select">Selecionar / mover</button><button id="draw">Linhas</button><button id="fit">Enquadrar</button><button id="undo">Desfazer desenho</button><button id="redo">Refazer desenho</button><button id="clear">Limpar</button><button id="back">Retirar ponto</button></div>
<div class="tools settings"><label><input id="snap" type="checkbox" checked>Grade</label><label>Passo <input id="step" type="number" min="0.1" max="100" step="0.5" value="5"> mm</label><label><input id="auto" type="checkbox" checked>Inferir horizontal/vertical</label><span class="tag" id="plane"></span></div>
<canvas id="canvas" tabindex="0" aria-label="Área de desenho do esboço. Clique em um segmento para selecionar ou arraste um vértice."></canvas>
<section id="relations"><div class="tools"><b>Relações e cotas</b><span id="selected"></span></div>
<div class="tools"><button data-kind="horizontal">Horizontal</button><button data-kind="vertical">Vertical</button><button id="fix">Fixar vértice</button><label>Comprimento <input id="length" aria-label="Comprimento do segmento em mm" type="number" min="0.1" max="10000" step="0.1" value="20"></label><button data-kind="length">Cotar</button></div>
<div class="tools"><button data-kind="parallel">Paralelos</button><button data-kind="perpendicular">Perpendiculares</button><button data-kind="equal">Iguais</button><label>Distância <input id="distance" aria-label="Distância entre vértices em mm" type="number" min="-10000" max="10000" value="20"></label><button data-kind="dx">ΔU</button><button data-kind="dy">ΔV</button></div>
<div id="list"></div></section>
<div class="tools"><button class="primary" id="apply">Usar este esboço</button><span id="summary" role="status"></span></div><div id="error" role="alert"></div><div id="hint"></div>
<script src="editor.js"></script></html>
