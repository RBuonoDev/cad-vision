<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#101b24;color:#dce8ea;font:13px system-ui}button,input{font:inherit;color:inherit;background:#1b303b;border:1px solid #38515c;border-radius:7px;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:hover:enabled{border-color:#65d8ba}button.primary{background:#58c9ab;color:#0c211c;font-weight:700}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px}label{display:flex;gap:5px;align-items:center}input[type=number]{width:62px}canvas{display:block;width:100%;height:340px;touch-action:none;background:#0c171f;cursor:crosshair}#hint{padding:10px 12px;min-height:42px;color:#9fb5bd}.tag{margin-left:auto;color:#65d8ba;font-size:11px;letter-spacing:1px}button:focus-visible,input:focus-visible{outline:2px solid #f2c97c}
</style>
<div class="tools"><button id="fit">Enquadrar</button><button id="clear">Limpar</button><button id="back">Retirar ponto</button><label><input id="snap" type="checkbox" checked>Grade</label><label>Passo <input id="step" type="number" min="0.1" max="100" step="0.5" value="5"> mm</label><span class="tag" id="plane"></span></div>
<canvas id="canvas" tabindex="0" aria-label="Área de desenho do esboço. Cotas também disponíveis no painel numérico."></canvas>
<div class="tools"><button class="primary" id="apply">Usar este esboço</button><span id="summary"></span></div><div id="hint"></div>
<script>
const send=(type,data={})=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
const cv=document.querySelector('canvas'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
let f=null,version=null,scale=3,cx=0,cy=0,points=[],closed=false,start=null,drag=-1,pan=null,dirty=false,fitPending=true;
const bounds=()=>cv.getBoundingClientRect();
function screen(p){return [cv.clientWidth/2+(p[0]-cx)*scale,cv.clientHeight/2-(p[1]-cy)*scale]}
function world(e,snap=true){const r=bounds();let u=cx+(e.clientX-r.left-cv.clientWidth/2)/scale,v=cy-(e.clientY-r.top-cv.clientHeight/2)/scale;const step=Math.max(.1,Number($('step').value)||5);if(snap&&$('snap').checked){u=Math.round(u/step)*step;v=Math.round(v/step)*step}return [Math.max(-10000,Math.min(10000,u)),Math.max(-10000,Math.min(10000,v))]}
function fit(){if(!f||cv.clientWidth<10){fitPending=true;return}fitPending=false;let w=f.profile==='circle'?f.diameter:f.length,h=f.profile==='circle'?f.diameter:f.width;cx=f.x;cy=f.y;if(f.profile==='polygon'&&points.length){const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);w=Math.max(...xs)-Math.min(...xs);h=Math.max(...ys)-Math.min(...ys);cx=(Math.max(...xs)+Math.min(...xs))/2;cy=(Math.max(...ys)+Math.min(...ys))/2}scale=Math.max(.01,Math.min(cv.clientWidth/(w*1.7+40),cv.clientHeight/(h*1.7+40)));draw()}
function draw(){if(!f)return;if(fitPending){if(cv.clientWidth>0)fit();return}const dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
let step=Math.max(.1,Number($('step').value)||5);while(step*scale<16)step*=2;const lo=world({clientX:bounds().left,clientY:bounds().bottom},false),hi=world({clientX:bounds().right,clientY:bounds().top},false);ctx.lineWidth=1;ctx.strokeStyle='#1b303b';ctx.beginPath();for(let x=Math.ceil(lo[0]/step)*step;x<=hi[0];x+=step){let p=screen([x,0]);ctx.moveTo(p[0],0);ctx.lineTo(p[0],h)}for(let y=Math.ceil(lo[1]/step)*step;y<=hi[1];y+=step){let p=screen([0,y]);ctx.moveTo(0,p[1]);ctx.lineTo(w,p[1])}ctx.stroke();let origin=screen([0,0]);ctx.strokeStyle='#52717c';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(origin[0],0);ctx.lineTo(origin[0],h);ctx.moveTo(0,origin[1]);ctx.lineTo(w,origin[1]);ctx.stroke();ctx.setLineDash([]);
ctx.beginPath();if(f.profile==='rectangle'){let p=screen([f.x-f.length/2,f.y+f.width/2]);ctx.rect(p[0],p[1],f.length*scale,f.width*scale)}else if(f.profile==='circle'){let p=screen([f.x,f.y]);ctx.arc(p[0],p[1],f.diameter*scale/2,0,2*Math.PI)}else if(points.length){points.forEach((p,i)=>{const q=screen(p);i?ctx.lineTo(...q):ctx.moveTo(...q)});if(closed)ctx.closePath()}
ctx.strokeStyle='#65d8ba';ctx.fillStyle='#65d8ba22';ctx.lineWidth=2;if(f.profile!=='polygon'||closed)ctx.fill();ctx.stroke();if(f.profile==='polygon')points.forEach((p,i)=>{let q=screen(p);ctx.beginPath();ctx.arc(...q,4,0,Math.PI*2);ctx.fillStyle='#f2c97c';ctx.fill();ctx.fillStyle='#dce8ea';ctx.font='11px system-ui';ctx.fillText(`${i+1} (${p[0].toFixed(1)}, ${p[1].toFixed(1)})`,q[0]+8,q[1]-8)});
ctx.fillStyle='#9fb5bd';ctx.font='12px system-ui';ctx.fillText('U →',w-40,h-12);ctx.fillText('V ↑',12,20);
$('summary').textContent=f.profile==='polygon'?`${points.length} vértices · ${closed?'fechado':'aberto'}`:f.profile==='circle'?`Ø ${f.diameter.toFixed(2)} mm`:`${f.length.toFixed(2)} × ${f.width.toFixed(2)} mm`;
$('hint').textContent=(dirty?'Alteração no desenho ainda não enviada. ':'')+(f.profile==='polygon'?'Clique para adicionar vértices; clique no primeiro para fechar. Arraste vértices para ajustar. Shift alinha o próximo segmento.':'Arraste para desenhar um novo perfil.')+' Roda: zoom · botão direito: mover.';
$('back').disabled=f.profile!=='polygon'||!points.length;$('apply').disabled=f.profile==='polygon'&&(!closed||points.length<3)}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{if(!f)return;cv.setPointerCapture(e.pointerId);if(e.button===2||e.button===1){pan={x:e.clientX,y:e.clientY,cx,cy};return}const p=world(e);if(f.profile==='polygon'){drag=points.findIndex(q=>Math.hypot(...screen(q).map((n,i)=>n-screen(p)[i]))<10);if(drag===0&&!closed&&points.length>=3){closed=true;drag=-1}else if(drag<0&&!closed&&points.length<100){if(e.shiftKey&&points.length){const q=points.at(-1);if(Math.abs(p[0]-q[0])>Math.abs(p[1]-q[1]))p[1]=q[1];else p[0]=q[0]}points.push(p)}dirty=true;draw()}else start=p});
cv.addEventListener('pointermove',e=>{if(pan){cx=pan.cx-(e.clientX-pan.x)/scale;cy=pan.cy+(e.clientY-pan.y)/scale;draw();return}if(drag>=0){points[drag]=world(e);dirty=true;draw()}if(start){const p=world(e);if(f.profile==='rectangle'){f.x=(start[0]+p[0])/2;f.y=(start[1]+p[1])/2;f.length=Math.max(.1,Math.abs(start[0]-p[0]));f.width=Math.max(.1,Math.abs(start[1]-p[1]))}else{f.x=start[0];f.y=start[1];f.diameter=Math.max(.1,2*Math.hypot(p[0]-start[0],p[1]-start[1]))}dirty=true;draw()}});
const release=()=>{start=null;drag=-1;pan=null};cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
cv.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.01,Math.min(100,scale*Math.exp(-e.deltaY*.001)));draw()},{passive:false});
$('fit').onclick=fit;$('clear').onclick=()=>{if(f.profile==='polygon'){points=[];closed=false}else{f.x=0;f.y=0;f.length=20;f.width=20;f.diameter=20}dirty=true;draw()};$('back').onclick=()=>{points.pop();closed=false;dirty=true;draw()};$('step').onchange=draw;
$('apply').onclick=()=>{let value={profile:f.profile,x:f.x,y:f.y,length:f.length,width:f.width,diameter:f.diameter,nonce:Date.now()};if(f.profile==='polygon'){value.x=0;value.y=0;value.points=points.map(p=>[...p])}send('streamlit:setComponentValue',{value,dataType:'json'});dirty=false;draw();$('hint').textContent='Esboço enviado ao painel. Clique em Aplicar operação para reconstruir a peça.'};
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.type!=='streamlit:render')return;const a=e.data.args;if(a.version!==version){version=a.version;f=structuredClone(a.feature);points=(f.points||[]).map(p=>[p[0]+f.x,p[1]+f.y]);closed=points.length>=3;dirty=false;$('plane').textContent=`PLANO ${f.plane} · mm`;fit()}draw();send('streamlit:setFrameHeight',{height:475})});
new ResizeObserver(draw).observe(cv);send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:475});
</script></html>
